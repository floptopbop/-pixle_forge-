<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PYFORGE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Anton&display=swap" rel="stylesheet">
<style>
/* RESET & ROOT
   ----------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #AEAEAE;
  --surface: #363E41;
  --surface2: #AEAEAE;
  --border: #222228;
  --border2: #2e2e38;
  --fg: #e8e8f0;
  --dim: #363E41;
  --dim2: #FEFCFD;
  --orange: #ff6b2b;
  --orange-d: #c04e18;
  --orange-glow: rgba(255, 107, 43, 0.15);
  --mono: 'DM Mono', monospace;
  --display: 'Anton', sans-serif;
  --panel-w: 320px;
  --radius: 3px;
}

html,
body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 11px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* LAYOUT
   ----------------------------------------------------------- */
#app {
  display: grid;
  grid-template-columns: var(--panel-w) 1fr;
  height: 100vh;
}

@media (max-width: 780px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  #panel {
    max-height: 60vh;
    overflow-y: auto;
  }
}

/* PANEL
   ----------------------------------------------------------- */
#panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  z-index: 10;
}

/* Typo fixed: sub text size was .1px → now 10px */
.sub {
  margin-top: 4px;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--dim);
  text-transform: uppercase;
}

/* MODULE TABS */
#module-tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.mtab {
  background: var(--surface);
  color: var(--dim);
  border: none;
  padding: 10px 8px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  line-height: 1.4;
  position: relative;
}
.mtab .mnum {
  color: var(--dim2);
  margin-right: 5px;
  font-weight: 500;
}
.mtab:hover {
  background: var(--surface2);
  color: var(--fg);
}
.mtab.active {
  background: var(--surface2);
  color: var(--orange);
  box-shadow: inset 2px 0 0 var(--orange);
}
.mtab.active .mnum {
  color: var(--orange-d);
}

/* SCROLL AREA */
#scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 80px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
  min-height: 0;
}
#scroll::-webkit-scrollbar { width: 4px; }
#scroll::-webkit-scrollbar-track { background: transparent; }
#scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.section-title {
  font-size: 7.5px;
  letter-spacing: 3px;
  color: var(--dim);
  text-transform: uppercase;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}

.effect-desc {
  font-size: 9px;
  line-height: 1.7;
  color: var(--dim);
  padding: 2px 0 4px;
  border-left: 2px solid var(--border2);
  padding-left: 10px;
}

/* PARAMS */
.params {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.param {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.param-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.param-name {
  font-size: 8.5px;
  letter-spacing: 1.2px;
  color: var(--dim);
  text-transform: uppercase;
}
.param-val {
  font-size: 12px;
  font-weight: 500;
  color: var(--orange);
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
}

/* Range input */
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 20px;
  background: transparent;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--border2);
  border-radius: 1px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  margin-top: -5.5px;
  background: var(--orange);
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
}
input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.4);
  box-shadow: 0 0 12px var(--orange);
}
input[type=range]::-moz-range-track {
  height: 2px;
  background: var(--border2);
  border-radius: 1px;
  border: none;
}
input[type=range]::-moz-range-thumb {
  width: 13px;
  height: 13px;
  background: var(--orange);
  border: none;
  border-radius: 50%;
  cursor: pointer;
}

/* Select */
.select-wrap {
  position: relative;
}
select {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.8px;
  padding: 7px 28px 7px 10px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
select:hover,
select:focus {
  border-color: var(--orange);
}
.select-arrow {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--dim);
  pointer-events: none;
  font-size: 9px;
}

/* Checkbox */
.checkrow {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.checkrow input[type=checkbox] {
  -webkit-appearance: none;
  appearance: none;
  width: 15px;
  height: 15px;
  border: 1px solid var(--border2);
  border-radius: 2px;
  background: var(--surface2);
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
}
.checkrow input[type=checkbox]:checked {
  background: var(--orange);
  border-color: var(--orange);
}
.checkrow input[type=checkbox]:checked::after {
  content: '';
  position: absolute;
  left: 4px;
  top: 1px;
  width: 4px;
  height: 8px;
  border: solid #0a0a0b;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.checkrow label {
  font-size: 8.5px;
  letter-spacing: 1.2px;
  color: var(--dim);
  text-transform: uppercase;
  cursor: pointer;
}

/* Buttons */
.btn-row {
  display: flex;
  gap: 6px;
}
.btn {
  flex: 1;
  padding: 9px 10px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.btn:hover {
  border-color: var(--orange);
  color: var(--orange);
}
.btn:disabled {
  opacity: 0.25;
  cursor: not-allowed;
  pointer-events: none;
}
.btn-accent {
  border-color: var(--orange-d);
  color: var(--orange);
}
.btn-accent:hover {
  background: var(--orange-glow);
}

/* STATUS BAR */
#status-bar {
  padding: 9px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}
#dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dim);
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
#dot.on {
  background: var(--orange);
  box-shadow: 0 0 8px var(--orange);
  animation: blink 0.9s infinite;
}
#dot.ok { background: var(--orange); }
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}
#status-msg {
  color: var(--dim);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 9px;
  letter-spacing: 0.5px;
}

/* VIEWPORT
   ----------------------------------------------------------- */
#viewport {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  overflow: hidden;
}
#viewport canvas {
  display: none;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
}
#drop-zone {
  border: 1px dashed var(--border2);
  border-radius: var(--radius);
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 1px;
  line-height: 2;
  transition: border-color 0.2s, color 0.2s, background 0.2s, box-shadow 0.2s;
}
#drop-zone:hover,
#drop-zone.over {
  border-color: var(--orange);
  color: var(--orange);
  background: var(--orange-glow);
  box-shadow: 0 0 20px rgba(255, 107, 43, 0.06);
}
.dz-icon {
  font-size: 20px;
  display: block;
  margin-bottom: 6px;
  opacity: 0.35;
  transition: opacity 0.2s;
}
#drop-zone:hover .dz-icon,
#drop-zone.over .dz-icon {
  opacity: 0.7;
}
#viewport canvas.show { display: block; }

#empty {
  text-align: center;
  color: var(--dim2);
  pointer-events: none;
  user-select: none;
}
.empty-word {
  font-family: var(--display);
  font-size: clamp(36px, 8vw, 64px);
  letter-spacing: 8px;
  color: var(--dim2);
  opacity: 0.5;
}
.empty-label {
  margin-top: 10px;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--dim2);
  opacity: 0.4;
}

/* PROGRESS BAR */
#prog-wrap {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: transparent;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
}
#prog-wrap.show { opacity: 1; }
#prog-bar {
  height: 100%;
  width: 0%;
  background: var(--orange);
  box-shadow: 0 0 10px var(--orange);
  transition: width 0.2s ease-out;
}

.hidden-input { display: none; }
</style>
</head>
<body>

    <div id="app">
        <!-- ══════════════════════════════════════════════════════════════════
        SIDE PANEL
        ══════════════════════════════════════════════════════════════════════ -->


            <div id="module-tabs"></div>

            <div id="scroll">
                <div>
                    <div class="section-title">Source</div>
                    <input type="file" id="file-in" accept="image/*" class="hidden-input">
                    <div id="drop-zone">
                        <span class="dz-icon">&#8595;</span>
                        DROP IMAGE<br>OR TAP TO BROWSE
                    </div>
                </div>

                <div id="module-desc"></div>
                <div id="module-params"></div>

                <div>
                    <div class="section-title">Export</div>
                    <div class="btn-row">
                        <button class="btn btn-accent" id="btn-png" disabled>&#8595; PNG</button>
                        <button class="btn" id="btn-reset" disabled>&#8634; Reset</button>
                    </div>
                </div>
            </div>

            <div id="status-bar">
                <div id="dot"></div>
                <span id="status-msg">Drop an image to begin</span>
            </div>
        </aside>

        <!-- ══════════════════════════════════════════════════════════════════
        VIEWPORT
        ══════════════════════════════════════════════════════════════════════ -->
        <main id="viewport">
            <div id="prog-wrap"><div id="prog-bar"></div></div>
            <div id="empty">
                <div class="empty-word">PYFORGE</div>
                <div class="empty-label">No image loaded</div>
            </div>
            <canvas id="main"></canvas>
        </main>
    </div>

    <script>
        (function() {
            // ═══════════════════════════════════════════════════════════════════
            // DOM REFS
            // ═══════════════════════════════════════════════════════════════════
            const mainCvs = document.getElementById('main');
            const ctx = mainCvs.getContext('2d', { willReadFrequently: true });
            const dropZone = document.getElementById('drop-zone');
            const empty = document.getElementById('empty');
            const dot = document.getElementById('dot');
            const statusMsg = document.getElementById('status-msg');
            const progWrap = document.getElementById('prog-wrap');
            const progBar = document.getElementById('prog-bar');
            const btnPng = document.getElementById('btn-png');
            const btnReset = document.getElementById('btn-reset');
            const tabsEl = document.getElementById('module-tabs');
            const descEl = document.getElementById('module-desc');
            const paramsEl = document.getElementById('module-params');
            const fileInput = document.getElementById('file-in');
            const viewport = document.getElementById('viewport');

            // ═══════════════════════════════════════════════════════════════════
            // STATE
            // ═══════════════════════════════════════════════════════════════════
            let srcImg = null;
            let srcCanvas = null; // offscreen canvas at full source resolution
            let running = false;
            let activeModule = null;
            let currentVals = {};
            let debounceTimer = null;
            const MAX_DIM = 640; // process at ≤640px for performance
            let workingWidth = 0; // dimensions of current working canvas
            let workingHeight = 0;

            // ═══════════════════════════════════════════════════════════════════
            // HELPERS
            // ═══════════════════════════════════════════════════════════════════
            function setStatus(state, msg) {
                dot.className = state;
                statusMsg.textContent = msg;
            }

            function setProgress(pct) {
                const clamped = Math.min(100, Math.max(0, Math.round(pct)));
                progBar.style.width = clamped + '%';
                progWrap.classList.toggle('show', clamped > 0 && clamped < 100);
            }

            function yieldFrame() {
                return new Promise(r => requestAnimationFrame(r));
            }

            const Clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

            // ═══════════════════════════════════════════════════════════════════
            // PRNG — fast 32-bit mulberry32
            // ═══════════════════════════════════════════════════════════════════
            function mulberry32(seed) {
                return function() {
                    seed |= 0;
                    seed = (seed + 0x6D2B79F5) | 0;
                    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            // ═══════════════════════════════════════════════════════════════════
            // CORE IMAGE UTILITIES
            // ═══════════════════════════════════════════════════════════════════
            const Core = {};

            /** Convert RGBA Uint8ClampedArray to grayscale Float32Array [0–255] */
            Core.toGray = function(data, w, h) {
                const out = new Float32Array(w * h);
                for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                    out[p] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                }
                return out;
            };

            /** 1D sliding-window box blur (O(n) per pass) */
            Core.boxBlur1D = function(src, w, h, radius, horizontal) {
                const out = new Float32Array(w * h);
                const size = radius * 2 + 1;
                if (horizontal) {
                    for (let y = 0; y < h; y++) {
                        let acc = 0;
                        const row = y * w;
                        for (let x = -radius; x <= radius; x++) acc += src[row + Clamp(x, 0, w - 1)];
                        for (let x = 0; x < w; x++) {
                            out[row + x] = acc / size;
                            const addX = Clamp(x + radius + 1, 0, w - 1);
                            const subX = Clamp(x - radius, 0, w - 1);
                            acc += src[row + addX] - src[row + subX];
                        }
                    }
                } else {
                    for (let x = 0; x < w; x++) {
                        let acc = 0;
                        for (let y = -radius; y <= radius; y++) acc += src[Clamp(y, 0, h - 1) * w + x];
                        for (let y = 0; y < h; y++) {
                            out[y * w + x] = acc / size;
                            const addY = Clamp(y + radius + 1, 0, h - 1);
                            const subY = Clamp(y - radius, 0, h - 1);
                            acc += src[addY * w + x] - src[subY * w + x];
                        }
                    }
                }
                return out;
            };

            /**
             * Approximate Gaussian blur via 4-pass box blur (same radius).
             * For artistic use; a true 3-pass Gaussian would use 3 different radii.
             */
            Core.gaussianApprox = function(src, w, h, radius) {
                if (radius <= 0) return src.slice();
                const r = Math.max(1, Math.round(radius));
                let a = Core.boxBlur1D(src, w, h, r, true);
                a = Core.boxBlur1D(a, w, h, r, false);
                a = Core.boxBlur1D(a, w, h, r, true);
                a = Core.boxBlur1D(a, w, h, r, false);
                return a;
            };

            /** Sobel edge detection. Returns {gx, gy, mag, angle} as Float32Arrays. */
            Core.sobel = function(gray, w, h) {
                const gx = new Float32Array(w * h);
                const gy = new Float32Array(w * h);
                const mag = new Float32Array(w * h);
                const angle = new Float32Array(w * h);
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const i = y * w + x;
                        const a = gray[i - w - 1],
                            b = gray[i - w],
                            c = gray[i - w + 1];
                        const d = gray[i - 1],
                            f = gray[i + 1];
                        const g = gray[i + w - 1],
                            hh = gray[i + w],
                            ii = gray[i + w + 1];
                        const dx = (c + 2 * f + ii) - (a + 2 * d + g);
                        const dy = (g + 2 * hh + ii) - (a + 2 * b + c);
                        gx[i] = dx;
                        gy[i] = dy;
                        mag[i] = Math.sqrt(dx * dx + dy * dy);
                        angle[i] = Math.atan2(dy, dx) * 180 / Math.PI;
                    }
                }
                return { gx, gy, mag, angle };
            };

            /**
             * Median-cut palette extraction.
             * Samples up to ~4000 pixels for performance, then recursively splits.
             */
            Core.extractPalette = function(data, w, h, k) {
                const pixels = [];
                const step = Math.max(1, Math.floor((w * h) / 4000));
                for (let p = 0, i = 0; i < data.length; i += 4 * step, p++) {
                    pixels.push([data[i], data[i + 1], data[i + 2]]);
                }
                if (pixels.length === 0) return [
                    [0, 0, 0]
                ];

                function cut(box, depth) {
                    if (depth <= 0 || box.length <= 1) {
                        let r = 0,
                            g = 0,
                            b = 0;
                        for (const p of box) { r += p[0];
                            g += p[1];
                            b += p[2]; }
                        const n = box.length || 1;
                        return [
                            [Math.round(r / n), Math.round(g / n), Math.round(b / n)]
                        ];
                    }
                    let rmin = 255,
                        rmax = 0,
                        gmin = 255,
                        gmax = 0,
                        bmin = 255,
                        bmax = 0;
                    for (const p of box) {
                        if (p[0] < rmin) rmin = p[0];
                        if (p[0] > rmax) rmax = p[0];
                        if (p[1] < gmin) gmin = p[1];
                        if (p[1] > gmax) gmax = p[1];
                        if (p[2] < bmin) bmin = p[2];
                        if (p[2] > bmax) bmax = p[2];
                    }
                    const rr = rmax - rmin,
                        gr = gmax - gmin,
                        br = bmax - bmin;
                    let axis = 0;
                    if (gr >= rr && gr >= br) axis = 1;
                    else if (br >= rr && br >= gr) axis = 2;
                    box.sort((a, b) => a[axis] - b[axis]);
                    const mid = box.length >> 1;
                    return [...cut(box.slice(0, mid), depth - 1), ...cut(box.slice(mid), depth - 1)];
                }
                const depth = Math.ceil(Math.log2(Math.max(1, k)));
                let palette = cut(pixels, depth);
                if (palette.length > k) palette = palette.slice(0, k);
                while (palette.length < k && palette.length > 0) palette.push(palette[palette.length -
                1]);
                return palette;
            };

            /** Nearest color in palette (Euclidean distance in RGB) */
            Core.nearestColor = function(r, g, b, palette) {
                let best = palette[0],
                    bestD = Infinity;
                for (const p of palette) {
                    const d = (p[0] - r) * (p[0] - r) + (p[1] - g) * (p[1] - g) + (p[2] - b) * (p[2] -
                    b);
                    if (d < bestD) { bestD = d;
                        best = p; }
                }
                return best;
            };

            /** Floyd-Steinberg error-diffusion dither (mutates data in place) */
            Core.floydSteinberg = function(data, w, h, palette) {
                const buf = new Float32Array(w * h * 3);
                for (let i = 0, p = 0; i < data.length; i += 4, p += 3) {
                    buf[p] = data[i];
                    buf[p + 1] = data[i + 1];
                    buf[p + 2] = data[i + 2];
                }
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const p = (y * w + x) * 3;
                        const old = [buf[p], buf[p + 1], buf[p + 2]];
                        const nc = Core.nearestColor(old[0], old[1], old[2], palette);
                        buf[p] = nc[0];
                        buf[p + 1] = nc[1];
                        buf[p + 2] = nc[2];
                        const er = old[0] - nc[0],
                            eg = old[1] - nc[1],
                            eb = old[2] - nc[2];
                        const pushErr = (xx, yy, f) => {
                            if (xx < 0 || xx >= w || yy < 0 || yy >= h) return;
                            const q = (yy * w + xx) * 3;
                            buf[q] += er * f;
                            buf[q + 1] += eg * f;
                            buf[q + 2] += eb * f;
                        };
                        pushErr(x + 1, y, 7 / 16);
                        pushErr(x - 1, y + 1, 3 / 16);
                        pushErr(x, y + 1, 5 / 16);
                        pushErr(x + 1, y + 1, 1 / 16);
                    }
                }
                for (let i = 0, p = 0; i < data.length; i += 4, p += 3) {
                    data[i] = Clamp(Math.round(buf[p]), 0, 255);
                    data[i + 1] = Clamp(Math.round(buf[p + 1]), 0, 255);
                    data[i + 2] = Clamp(Math.round(buf[p + 2]), 0, 255);
                }
            };

            /** Bayer 8×8 matrix normalized to [-0.5, 0.5) */
            const BAYER_8x8 = [
                [0, 32, 8, 40, 2, 34, 10, 42],
                [48, 16, 56, 24, 50, 18, 58, 26],
                [12, 44, 4, 36, 14, 46, 6, 38],
                [60, 28, 52, 20, 62, 30, 54, 22],
                [3, 35, 11, 43, 1, 33, 9, 41],
                [51, 19, 59, 27, 49, 17, 57, 25],
                [15, 47, 7, 39, 13, 45, 5, 37],
                [63, 31, 55, 23, 61, 29, 53, 21]
            ].map(row => row.map(v => v / 64 - 0.5));

            /** Bayer ordered dither (mutates data in place) */
            Core.bayerDither = function(data, w, h, palette, spread) {
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        const thresh = BAYER_8x8[y & 7][x & 7] * spread;
                        const r = Clamp(data[i] + thresh, 0, 255);
                        const g = Clamp(data[i + 1] + thresh, 0, 255);
                        const b = Clamp(data[i + 2] + thresh, 0, 255);
                        const nc = Core.nearestColor(r, g, b, palette);
                        data[i] = nc[0];
                        data[i + 1] = nc[1];
                        data[i + 2] = nc[2];
                    }
                }
            };

            /**
             * Recursive quadtree split.
             * Calls onLeaf(x, y, w, h) for each terminal block.
             * Uses stddev of luminance to decide whether to split further.
             */
            Core.quadSplit = function(data, imgW, x, y, w, h, depth, opts) {
                const { minSize, maxDepth, entropyLimit, minDepth, onLeaf } = opts;
                if (w <= minSize || h <= minSize || depth >= maxDepth) {
                    onLeaf(x, y, w, h);
                    return;
                }
                // Sample luminance within block for stddev
                let sum = 0,
                    sumSq = 0,
                    n = 0;
                const stepX = Math.max(1, Math.floor(w / 16));
                const stepY = Math.max(1, Math.floor(h / 16));
                for (let yy = y; yy < y + h; yy += stepY) {
                    for (let xx = x; xx < x + w; xx += stepX) {
                        const i = (yy * imgW + xx) * 4;
                        const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                        sum += lum;
                        sumSq += lum * lum;
                        n++;
                    }
                }
                const mean = sum / (n || 1);
                const variance = Math.max(0, sumSq / (n || 1) - mean * mean);
                const stddev = Math.sqrt(variance);

                if (stddev > entropyLimit || depth < minDepth) {
                    const hw = w >> 1,
                        hh = h >> 1;
                    if (hw < 1 || hh < 1) { onLeaf(x, y, w, h); return; }
                    Core.quadSplit(data, imgW, x, y, hw, hh, depth + 1, opts);
                    Core.quadSplit(data, imgW, x + hw, y, w - hw, hh, depth + 1, opts);
                    Core.quadSplit(data, imgW, x, y + hh, hw, h - hh, depth + 1, opts);
                    Core.quadSplit(data, imgW, x + hw, y + hh, w - hw, h - hh, depth + 1, opts);
                } else {
                    onLeaf(x, y, w, h);
                }
            };

            // ═══════════════════════════════════════════════════════════════════
            // MODULE DEFINITIONS
            // Each: { id, name, desc, params:[{key,label,type,min,max,step,default,options}],
            //         async run(ctx, w, h, vals) }
            // ═══════════════════════════════════════════════════════════════════
            const MODULES = [];

            // ── 1. QUADTREE WARP ──────────────────────────────────────────────
            MODULES.push({
                id: 'quadwarp',
                name: 'Quadtree Warp',
                desc: 'Gradient-field spatial warp, golden-ratio echo blend, recursive quadtree poison (invert/posterize), chromatic split, and final color quantize.',
                params: [
                    { key: 'warp', label: 'Warp Strength', type: 'range', min: 0, max: 15, step: 0.5,
                        default: 6 },
                    { key: 'entropy', label: 'Entropy Limit', type: 'range', min: 3, max: 40, step: 1,
                        default: 15 },
                    { key: 'maxDepth', label: 'Max Depth', type: 'range', min: 2, max: 8, step: 1,
                    default: 6 },
                    { key: 'poison', label: 'Poison Chance', type: 'range', min: 0, max: 1, step: 0.05,
                        default: 0.2 },
                    { key: 'chromatic', label: 'Chromatic Shift', type: 'range', min: 0, max: 12, step: 1,
                        default: 4 },
                    { key: 'colors', label: 'Quantize Colors', type: 'range', min: 2, max: 64, step: 1,
                        default: 16 },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;
                    const gray = Core.toGray(data, w, h);
                    const grayN = new Float32Array(w * h);
                    for (let i = 0; i < gray.length; i++) grayN[i] = gray[i] / 255;
                    const { gx, gy } = Core.sobel(gray, w, h);
                    const src = new Uint8ClampedArray(data);

                    setStatus('on', 'Warping spatial field…');
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const i = y * w + x;
                            const brightness = grayN[i];
                            const dxg = gx[i] / 4,
                                dyg = gy[i] / 4;
                            const angle = Math.atan2(dyg, dxg) + 1.0;
                            const mag = Math.sqrt(dxg * dxg + dyg * dyg) / 255;
                            const dx = Math.cos(angle) * mag * (0.5 + brightness) * v.warp;
                            const dy = Math.sin(angle) * mag * (0.5 + brightness) * v.warp;
                            const sx = Clamp(Math.round(x + dx), 0, w - 1);
                            const sy = Clamp(Math.round(y + dy), 0, h - 1);
                            const si = (sy * w + sx) * 4,
                                di = i * 4;
                            data[di] = src[si];
                            data[di + 1] = src[si + 1];
                            data[di + 2] = src[si + 2];
                            data[di + 3] = 255;
                        }
                        if (y % 40 === 0) { setProgress(Math.round(y / h * 40));
                            await yieldFrame(); }
                    }

                    setStatus('on', 'Quadtree poison pass…');
                    const rng = mulberry32(12345);
                    const leaves = [];
                    Core.quadSplit(data, w, 0, 0, w, h, 0, {
                        minSize: 4,
                        maxDepth: v.maxDepth,
                        entropyLimit: v.entropy,
                        minDepth: 2,
                        onLeaf: (bx, by, bw, bh) => leaves.push([bx, by, bw, bh])
                    });
                    for (let li = 0; li < leaves.length; li++) {
                        const [bx, by, bw, bh] = leaves[li];
                        if (rng() < v.poison) {
                            const invert = rng() > 0.5;
                            for (let yy = by; yy < by + bh; yy++) {
                                for (let xx = bx; xx < bx + bw; xx++) {
                                    const i = (yy * w + xx) * 4;
                                    if (invert) {
                                        data[i] = 255 - data[i];
                                        data[i + 1] = 255 - data[i + 1];
                                        data[i + 2] = 255 - data[i + 2];
                                    } else {
                                        const levels = 2 + Math.floor(rng() * 3);
                                        const step = 255 / (levels - 1);
                                        data[i] = Math.round(Math.round(data[i] / step) * step);
                                        data[i + 1] = Math.round(Math.round(data[i + 1] / step) * step);
                                        data[i + 2] = Math.round(Math.round(data[i + 2] / step) * step);
                                    }
                                }
                            }
                        }
                        if (li % 200 === 0) { setProgress(40 + Math.round(li / leaves.length * 30));
                            await yieldFrame(); }
                    }

                    setStatus('on', 'Chromatic split + quantize…');
                    if (v.chromatic > 0) {
                        const shift = Math.round(v.chromatic);
                        const copy = new Uint8ClampedArray(data);
                        for (let y = 0; y < h; y++) {
                            for (let x = 0; x < w; x++) {
                                const di = (y * w + x) * 4;
                                const rx = Clamp(x - shift, 0, w - 1),
                                    bx2 = Clamp(x + shift, 0, w - 1);
                                data[di] = copy[(y * w + rx) * 4];
                                data[di + 2] = copy[(y * w + bx2) * 4 + 2];
                            }
                        }
                    }
                    await yieldFrame();
                    setProgress(80);
                    const palette = Core.extractPalette(data, w, h, Math.round(v.colors));
                    for (let i = 0; i < data.length; i += 4) {
                        const nc = Core.nearestColor(data[i], data[i + 1], data[i + 2], palette);
                        data[i] = nc[0];
                        data[i + 1] = nc[1];
                        data[i + 2] = nc[2];
                    }
                    ctx.putImageData(id, 0, 0);
                    setProgress(100);
                }
            });

            // ── 2. SOBEL INK STROKES ──────────────────────────────────────────
            MODULES.push({
                id: 'inkstrokes',
                name: 'Sobel Ink Strokes',
                desc: 'Directional ink strokes derived from Sobel gradient magnitude, with drift-drag trailing and pooling at stroke clusters.',
                params: [
                    { key: 'preblur', label: 'Pre-blur Radius', type: 'range', min: 0, max: 5, step: 0.5,
                        default: 1 },
                    { key: 'threshold', label: 'Stroke Threshold', type: 'range', min: 0, max: 60,
                        step: 1, default: 8 },
                    { key: 'driftX', label: 'Drift X', type: 'range', min: -5, max: 5, step: 1,
                    default: 1 },
                    { key: 'driftY', label: 'Drift Y', type: 'range', min: -5, max: 5, step: 1,
                        default: -1 },
                    { key: 'cycles', label: 'Drift Cycles', type: 'range', min: 0, max: 6, step: 1,
                        default: 2 },
                    { key: 'pool', label: 'Pool Intensity', type: 'range', min: 0, max: 1, step: 0.05,
                        default: 0.9 },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;
                    let gray = Core.toGray(data, w, h);
                    setStatus('on', 'Pre-blurring…');
                    gray = Core.gaussianApprox(gray, w, h, v.preblur);
                    await yieldFrame();
                    setProgress(20);

                    setStatus('on', 'Computing gradient magnitude…');
                    const { mag } = Core.sobel(gray, w, h);
                    let maxMag = 0;
                    for (let i = 0; i < mag.length; i++)
                        if (mag[i] > maxMag) maxMag = mag[i];
                    const norm = new Float32Array(mag.length);
                    for (let i = 0; i < mag.length; i++) norm[i] = maxMag > 0 ? mag[i] / maxMag * 255 : 0;
                    await yieldFrame();
                    setProgress(40);

                    let stroke = new Float32Array(w * h);
                    for (let i = 0; i < stroke.length; i++) {
                        const inkWeight = Clamp((norm[i] - v.threshold) / (255 - v.threshold), 0, 1);
                        stroke[i] = 255 - inkWeight * 255;
                    }
                    stroke = Core.gaussianApprox(stroke, w, h, 0.5);
                    setProgress(55);

                    for (let c = 0; c < v.cycles; c++) {
                        const dragged = new Float32Array(w * h);
                        for (let y = 0; y < h; y++) {
                            for (let x = 0; x < w; x++) {
                                const sx = Clamp(x - v.driftX, 0, w - 1);
                                const sy = Clamp(y - v.driftY, 0, h - 1);
                                dragged[y * w + x] = stroke[sy * w + sx];
                            }
                        }
                        for (let i = 0; i < stroke.length; i++) stroke[i] = Math.min(stroke[i], dragged[
                        i]);
                        await yieldFrame();
                        setProgress(55 + Math.round((c + 1) / Math.max(1, v.cycles) * 20));
                    }

                    const poolMask = Core.gaussianApprox(stroke.map(s => 255 - s), w, h, 2.0);
                    for (let i = 0; i < stroke.length; i++) {
                        const pm = Clamp(poolMask[i] * v.pool, 0, 60);
                        stroke[i] = Clamp(stroke[i] - pm, 0, 255);
                    }
                    setProgress(85);

                    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                        const val = stroke[p];
                        data[i] = val;
                        data[i + 1] = val;
                        data[i + 2] = val;
                        data[i + 3] = 255;
                    }
                    ctx.putImageData(id, 0, 0);
                    setProgress(100);
                }
            });

            // ── 3. SUMI-E WASH ────────────────────────────────────────────────
            MODULES.push({
                id: 'sumie',
                name: 'Sumi-e Wash',
                desc: 'Three-layer ink wash: ghost wash (diffuse dark bloom), mid bloom (directional wet pools), and black strokes (edge-derived), composited onto paper with optional hanko seal.',
                params: [
                    { key: 'paperWhite', label: 'Paper Tone', type: 'range', min: 200, max: 255,
                        step: 1, default: 252 },
                    { key: 'ghostBlur', label: 'Ghost Blur', type: 'range', min: 0, max: 10, step: 0.5,
                        default: 3 },
                    { key: 'ghostOp', label: 'Ghost Opacity', type: 'range', min: 0, max: 0.6,
                        step: 0.02, default: 0.18 },
                    { key: 'ghostDark', label: 'Ghost Darken', type: 'range', min: 20, max: 220,
                        step: 5, default: 130 },
                    { key: 'bloomBlur', label: 'Bloom Blur', type: 'range', min: 0, max: 6, step: 0.5,
                        default: 1 },
                    { key: 'bloomOp', label: 'Bloom Opacity', type: 'range', min: 0, max: 0.5,
                        step: 0.02, default: 0.1 },
                    { key: 'strokeThresh', label: 'Stroke Sharpness', type: 'range', min: 0, max: 40,
                        step: 1, default: 2 },
                    { key: 'hanko', label: 'Hanko Seal', type: 'checkbox', default: true },
                    { key: 'hankoPos', label: 'Seal Position', type: 'select', options: [
                            'bottom-right', 'top-left'
                        ], default: 'bottom-right' },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;
                    const gray = Core.toGray(data, w, h);

                    setStatus('on', 'Ghost wash…');
                    const ghostMask = new Float32Array(w * h);
                    for (let i = 0; i < gray.length; i++) ghostMask[i] = gray[i] < v.ghostDark ? gray[
                        i] : 255;
                    const ghost = Core.gaussianApprox(ghostMask, w, h, v.ghostBlur);
                    await yieldFrame();
                    setProgress(20);

                    setStatus('on', 'Mid bloom…');
                    const bloomMask = new Float32Array(w * h);
                    for (let i = 0; i < gray.length; i++) bloomMask[i] = gray[i] < 60 ? gray[i] : 255;
                    let bloom = Core.gaussianApprox(bloomMask, w, h, v.bloomBlur);
                    const dx = -1,
                        dy = 1;
                    const drifted = new Float32Array(w * h);
                    for (let y = 0; y < h; y++)
                        for (let x = 0; x < w; x++) {
                            const sx = Clamp(x - dx, 0, w - 1),
                                sy = Clamp(y - dy, 0, h - 1);
                            drifted[y * w + x] = bloom[sy * w + sx];
                        }
                    for (let i = 0; i < bloom.length; i++) bloom[i] = Math.min(bloom[i], drifted[i]);
                    await yieldFrame();
                    setProgress(40);

                    setStatus('on', 'Black strokes…');
                    const smoothed = Core.gaussianApprox(gray, w, h, 1);
                    const { mag } = Core.sobel(smoothed, w, h);
                    let maxMag = 0;
                    for (let i = 0; i < mag.length; i++)
                        if (mag[i] > maxMag) maxMag = mag[i];
                    let strokes = new Float32Array(w * h);
                    for (let i = 0; i < mag.length; i++) {
                        const m = maxMag > 0 ? mag[i] / maxMag * 255 : 0;
                        const inkWeight = Clamp((m - v.strokeThresh) / (255 - v.strokeThresh), 0, 1);
                        strokes[i] = 255 - inkWeight * 255;
                    }
                    strokes = Core.gaussianApprox(strokes, w, h, 0.5);
                    for (let c = 0; c < 2; c++) {
                        const dr = new Float32Array(w * h);
                        for (let y = 0; y < h; y++)
                            for (let x = 0; x < w; x++) {
                                const sx = Clamp(x - 1, 0, w - 1),
                                    sy = Clamp(y + 1, 0, h - 1);
                                dr[y * w + x] = strokes[sy * w + sx];
                            }
                        for (let i = 0; i < strokes.length; i++) strokes[i] = Math.min(strokes[i], dr[i]);
                    }
                    await yieldFrame();
                    setProgress(65);

                    setStatus('on', 'Compositing paper…');
                    const paper = new Float32Array(w * h).fill(v.paperWhite);
                    const blendOnto = (paperArr, layerArr, opacity) => {
                        for (let i = 0; i < paperArr.length; i++) {
                            const ink = Clamp(((255 - layerArr[i]) / 255) * opacity, 0, 1);
                            paperArr[i] = paperArr[i] * (1 - ink);
                        }
                    };
                    blendOnto(paper, ghost, v.ghostOp);
                    blendOnto(paper, bloom, v.bloomOp);
                    blendOnto(paper, strokes, 1.0);
                    setProgress(85);

                    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                        const val = Clamp(paper[p] * 1.15 - 15, 0, 255);
                        data[i] = val;
                        data[i + 1] = val;
                        data[i + 2] = val;
                        data[i + 3] = 255;
                    }

                    // Hanko seal stamp
                    if (v.hanko) {
                        const size = Math.max(48, Math.round(Math.max(w, h) * 0.07));
                        const sx = v.hankoPos === 'top-left' ? 40 : w - size - 50;
                        const sy = v.hankoPos === 'top-left' ? 40 : h - size - 50;
                        const pad = Math.max(3, Math.floor(size / 10));
                        const bw = Math.max(2, Math.floor(size / 20));
                        for (let yy = 0; yy < size; yy++) {
                            for (let xx = 0; xx < size; xx++) {
                                const onBorder = (xx >= pad && xx < pad + bw) || (xx >= size - pad - bw &&
                                    xx < size - pad) ||
                                    (yy >= pad && yy < pad + bw) || (yy >= size - pad - bw && yy < size -
                                        pad);
                                if (onBorder && xx >= pad && xx < size - pad && yy >= pad && yy < size -
                                    pad) {
                                    const px = sx + xx,
                                        py = sy + yy;
                                    if (px >= 0 && px < w && py >= 0 && py < h) {
                                        const i = (py * w + px) * 4;
                                        data[i] = 175;
                                        data[i + 1] = 20;
                                        data[i + 2] = 20;
                                    }
                                }
                            }
                        }
                    }

                    ctx.putImageData(id, 0, 0);
                    setProgress(100);
                }
            });

            // ── 4. ASCII / GLYPH RENDER ───────────────────────────────────────
            MODULES.push({
                id: 'ascii',
                name: 'ASCII Glyph Render',
                desc: 'Edge-traced glyph rendering with selectable character sets: directional lines, bubbly dots, or block ramps.',
                params: [
                    { key: 'cellSize', label: 'Cell Size (px)', type: 'range', min: 4, max: 20, step: 1,
                        default: 8 },
                    { key: 'glyphSet', label: 'Glyph Set', type: 'select', options: ['directional',
                            'bubbly', 'blocks'
                        ], default: 'directional' },
                    { key: 'edgeSens', label: 'Edge Sensitivity', type: 'range', min: 5, max: 100,
                        step: 1, default: 40 },
                    { key: 'color', label: 'True Color', type: 'checkbox', default: true },
                    { key: 'bg', label: 'Dark Background', type: 'checkbox', default: true },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;
                    const gray = Core.toGray(data, w, h);
                    const { mag, angle } = Core.sobel(gray, w, h);
                    let maxMag = 0;
                    for (let i = 0; i < mag.length; i++)
                        if (mag[i] > maxMag) maxMag = mag[i];

                    const cell = Math.round(v.cellSize);
                    const cols = Math.ceil(w / cell),
                        rows = Math.ceil(h / cell);
                    const out = new Uint8ClampedArray(data.length);
                    const bgVal = v.bg ? 8 : 255;
                    for (let i = 0; i < out.length; i += 4) { out[i] = bgVal;
                        out[i + 1] = bgVal;
                        out[i + 2] = bgVal;
                        out[i + 3] = 255; }

                    setStatus('on', 'Rendering glyphs…');

                    const setPx = (x, y, r, g, b) => {
                        if (x < 0 || x >= w || y < 0 || y >= h) return;
                        const di = (y * w + x) * 4;
                        out[di] = r;
                        out[di + 1] = g;
                        out[di + 2] = b;
                        out[di + 3] = 255;
                    };

                    for (let cy = 0; cy < rows; cy++) {
                        for (let cx = 0; cx < cols; cx++) {
                            const px = cx * cell,
                                py = cy * cell;
                            const sampleX = Math.min(w - 1, px + (cell >> 1));
                            const sampleY = Math.min(h - 1, py + (cell >> 1));
                            const i = sampleY * w + sampleX;
                            const m = maxMag > 0 ? mag[i] / maxMag * 255 : 0;
                            const lum = gray[i];
                            let r = lum,
                                g = lum,
                                b = lum;
                            if (v.color) { const di = i * 4;
                                r = data[di];
                                g = data[di + 1];
                                b = data[di + 2]; }

                            const drawGlyph = m > v.edgeSens;
                            let strokeType = 'dot';
                            if (drawGlyph && v.glyphSet !== 'blocks') {
                                const a = ((angle[i] % 180) + 180) % 180;
                                if (a < 22.5 || a >= 157.5) strokeType = 'h';
                                else if (a < 67.5) strokeType = 'd1';
                                else if (a < 112.5) strokeType = 'v';
                                else strokeType = 'd2';
                            }

                            const thickness = Math.max(1, Math.floor(cell / 6));
                            const midX = Math.floor((px + Math.min(w, px + cell)) / 2);
                            const midY = Math.floor((py + Math.min(h, py + cell)) / 2);
                            const cx0 = px,
                                cy0 = py,
                                cx1 = Math.min(w, px + cell),
                                cy1 = Math.min(h, py + cell);

                            if (v.glyphSet === 'blocks') {
                                if (m > v.edgeSens * 0.6) {
                                    for (let yy = cy0; yy < cy1; yy++)
                                        for (let xx = cx0; xx < cx1; xx++) {
                                            if ((xx + yy) % 2 === 0) setPx(xx, yy, r, g, b);
                                        }
                                }
                            } else if (v.glyphSet === 'bubbly') {
                                // Radius scales with brightness; always at least 1px
                                const idx = Math.round((lum / 255) * 3); // 0–3
                                const rad = Math.max(1, Math.floor(cell * 0.2 * (idx + 1) / 4 * 2.5));
                                for (let yy = -rad; yy <= rad; yy++)
                                    for (let xx = -rad; xx <= rad; xx++) {
                                        if (xx * xx + yy * yy <= rad * rad) setPx(midX + xx, midY + yy, r,
                                            g, b);

                    setStatus('on', 'Sorting cascades…');

                    for (let x = 0; x < w; x++) {
                        let y = 0;
                        while (y < h) {
                            let yEnd = y + 1;
                            while (yEnd < h && mag[yEnd * w + x] < v.edgeThresh && (yEnd - y) < v

                            const segment = [];
                            for (let sy = y; sy < yEnd; sy++) {
                                const i = (sy * w + x) * 4;
                                segment.push([src[i], src[i + 1], src[i + 2]]);

                                const la = 0.299 * a[0] + 0.587 * a[1] + 0.114 * a[2];

                    <span>${p.label}</span>
                  </label>
                `;
                        row.querySelector('input').addEventListener('change', (e) => {
                            currentVals[p.key] = e.target.checked;
                            scheduleRender();
                        });
                    }
                    wrap.appendChild(row);
                });
                paramsEl.appendChild(wrap);
            }

            /** Debounced render trigger */
            function scheduleRender() {
                if (!srcCanvas || !activeModule) return;
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(runActiveModule, 120);
            }

            /** Downscale source to maxDim for processing */
            function downscaleForProcessing(source, maxDim) {
                const w = source.width,
                    h = source.height;
                const longest = Math.max(w, h);
                const scale = longest > maxDim ? maxDim / longest : 1;
                const cw = Math.max(1, Math.round(w * scale));
                const ch = Math.max(1, Math.round(h * scale));
                const c = document.createElement('canvas');
                c.width = cw;
                c.height = ch;
                c.getContext('2d').drawImage(source, 0, 0, cw, ch);
                return { canvas: c, scale, width: cw, height: ch };
            }

            /** Run the active module on the current source */
            async function runActiveModule() {
                if (running || !srcCanvas || !activeModule) return;
                running = true;
                btnPng.disabled = true;
                btnReset.disabled = true;

                // Reset working canvas to a fresh downscaled copy each run
                const work = downscaleForProcessing(srcCanvas, MAX_DIM);
                mainCvs.width = work.width;
                mainCvs.height = work.height;
                workingWidth = work.width;
                workingHeight = work.height;
                ctx.drawImage(work.canvas, 0, 0);

                try {
                    await activeModule.run(ctx, workingWidth, workingHeight, currentVals);
                    // Update working dims in case module changed canvas size (e.g. CRT bezel)
                    workingWidth = mainCvs.width;
                    workingHeight = mainCvs.height;
                    setStatus('ok', `${activeModule.name} — ready`);
                } catch (err) {
                    setStatus('', 'Error — see console');
                    console.error('Module error:', err);
                }
                setProgress(0);
                running = false;
                btnPng.disabled = false;
                btnReset.disabled = false;
            }

            // ── FILE LOADING ──────────────────────────────────────────────────
            function loadImageFile(file) {
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        srcImg = img;
                        srcCanvas = document.createElement('canvas');
                        srcCanvas.width = img.naturalWidth;
                        srcCanvas.height = img.naturalHeight;
                        srcCanvas.getContext('2d').drawImage(img, 0, 0);

                        empty.style.display = 'none';
                        mainCvs.classList.add('show');
                        btnReset.disabled = false;
                        setStatus('ok', `Loaded ${img.naturalWidth}×${img.naturalHeight}`);

                        if (!activeModule) selectModule(MODULES[0].id);
                        else scheduleRender();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            // Drop zone events
            dropZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files[0]) loadImageFile(e.target.files[0]);
            });
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('over');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('over');
                if (e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
            });

            // Also allow dropping anywhere on the viewport
            viewport.addEventListener('dragover', (e) => e.preventDefault());
            viewport.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
            });

            // ── EXPORT ────────────────────────────────────────────────────────
            btnPng.addEventListener('click', () => {
                if (!srcCanvas) return;
                // Export at current working resolution (preserves bezel etc.)
                const outCanvas = document.createElement('canvas');
                outCanvas.width = workingWidth;
                outCanvas.height = workingHeight;
                const octx = outCanvas.getContext('2d');
                octx.imageSmoothingEnabled = false;
                octx.drawImage(mainCvs, 0, 0);

                outCanvas.toBlob((blob) => {
                    if (!blob) return;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `PYFORGE_${activeModule ? activeModule.id : 'export'}_${Date.now()}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                }, 'image/png');
            });

            // ── RESET ─────────────────────────────────────────────────────────
            btnReset.addEventListener('click', () => {
                if (!srcCanvas || !activeModule) return;
                currentVals = {};
                activeModule.params.forEach(p => currentVals[p.key] = p.default);
                buildParamUI();
                scheduleRender();
            });

            // ── INIT ──────────────────────────────────────────────────────────
            buildTabs();
            selectModule(MODULES[0].id);
            setStatus('', 'Drop an image to begin');
            workingWidth = mainCvs.width;
            workingHeight = mainCvs.height;

        })();
    </script>
</body>
</html>
