<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PYFORGE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Anton&display=swap" rel="stylesheet">
<style>
/* RESET & ROOT
   ----------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #2D2C2E;
  --surface: #605D5E;
  --surface2: #b99e78;
  --border: #241811;
  --border2: #4d372a;
  --fg: #f4e9d8;
  --dim: #a98e6c;
  --dim2: #fff6ea;
  --accent: #c0392b;
  --accent-d: #8e2a1f;
  --accent-glow: rgba(192, 57, 43, 0.18);
  --mono: 'DM Mono', monospace;
  --display: 'Anton', sans-serif;
  --panel-w: 320px; /* FIXED: Changed from 100% to a sane desktop width */
  --radius: 3px;
}

html,
body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 11px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* LAYOUT
   ----------------------------------------------------------- */
#app {
  display: grid;
  grid-template-columns: var(--panel-w) 1fr;
  height: 100vh;
}

/* PANEL
   ----------------------------------------------------------- */
#panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  z-index: 10;
}

#panel-tab {
  display: none;
  align-items: center;
  justify-content: center;
  height: 44px;
  flex-shrink: 0;
  cursor: pointer;
}

#panel-tab .grip {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--border2);
  transition: background 0.15s;
}

#panel-tab:hover .grip,
#panel.expanded #panel-tab .grip {
  background: var(--accent);
}

#panel-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.sub {
  margin-top: 4px;
  font-size: 11px; /* Compressed for better density */
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
}

/* MODULE TABS */
#module-tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.mtab {
  background: var(--surface);
  color: var(--dim);
  border: none;
  padding: 10px 8px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  line-height: 1.4;
}

.mtab .mnum {
  color: var(--dim2);
  margin-right: 5px;
  font-weight: 500;
}

.mtab:hover {
  background: var(--surface2);
  color: var(--fg);
}

.mtab.active {
  background: var(--surface2);
  color: var(--accent);
  box-shadow: inset 2px 0 0 var(--accent);
}

.mtab.active .mnum {
  color: var(--accent-d);
}

/* SCROLL AREA */
#scroll {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 40px; /* Streamlined margins to eliminate screen wasting */
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
  min-height: 0;
}

#scroll::-webkit-scrollbar { width: 4px; }
#scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.section-title {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.effect-desc {
  font-size: 11px;
  line-height: 1.5;
  color: var(--dim);
  padding: 2px 0 2px 10px;
  border-left: 2px solid var(--border2);
}

/* PARAMS */
.params {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.param {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.param-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.param-name {
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--dim);
  text-transform: uppercase;
}

.param-val {
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

/* Input Elements Optimization */
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 20px;
  background: transparent;
  outline: none;
  cursor: pointer;
}

input[type=range]::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--border2);
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -5px;
  background: var(--accent);
  border-radius: 50%;
  transition: transform 0.12s;
}

input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.3);
}

.select-wrap {
  position: relative; /* FIXED: Was absolute, which broke document flow */
  width: 100%;
}

select {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 10px;
  padding: 6px 24px 6px 8px;
  cursor: pointer;
  outline: none;
}

.select-arrow {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--dim);
  pointer-events: none;
}

/* Checkbox */
.checkrow {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}

.checkrow input[type=checkbox] {
  appearance: none;
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border: 1px solid var(--border2);
  border-radius: 2px;
  background: var(--surface2);
  cursor: pointer;
  position: relative;
}

.checkrow input[type=checkbox]:checked {
  background: var(--accent);
  border-color: var(--accent);
}

.checkrow input[type=checkbox]:checked::after {
  content: '';
  position: absolute;
  left: 4px;
  top: 1px;
  width: 4px;
  height: 7px;
  border: solid var(--fg);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* Buttons */
.btn-row {
  display: flex;
  gap: 6px;
}

.btn {
  flex: 1;
  padding: 8px 10px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn-accent {
  border-color: var(--accent);
  color: var(--accent);
}

.btn-accent:hover {
  background: var(--accent-glow);
}

/* STATUS BAR */
#status-bar {
  padding: 8px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

#dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dim);
}

#dot.on {
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: blink 0.9s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

#status-msg {
  color: var(--dim);
  font-size: 9px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* VIEWPORT
   ----------------------------------------------------------- */
#viewport {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  overflow: hidden;
  padding: 20px;
}

#viewport canvas {
  display: none;
  image-rendering: pixelated;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

#viewport canvas.show { display: block; }

#drop-zone {
  border: 1px dashed var(--border2);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  color: var(--dim);
}

#empty {
  text-align: center;
  color: var(--dim2);
}

.empty-word {
  font-family: var(--display);
  font-size: clamp(32px, 6vw, 54px);
  letter-spacing: 6px;
  opacity: 0.3;
}

/* PROGRESS BAR */
#prog-wrap {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  z-index: 5;
  opacity: 0;
}

#prog-wrap.show { opacity: 1; }
#prog-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
}

.hidden-input { display: none; }

/* MOBILE BREAKPOINT (KEEP LAST)
   ----------------------------------------------------------- */
@media (max-width: 780px) {
  #app {
    display: block;
    position: relative;
    height: 100vh;
  }
  #viewport {
    position: absolute;
    inset: 0;
    padding: 0;
  }
  #panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    border-right: none;
    border-top: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.4);
  }
  #module-tabs {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
  }
  .mtab {
    flex-shrink: 0;
    padding: 12px 16px;
  }
  #panel-tab {
    display: flex;
  }
  #panel-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease-out;
  }
  #panel.expanded #panel-body {
    max-height: 30vh;
  }
  #scroll {
    max-height: 50vh;
    padding-bottom: 8px;
  }
  #empty {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }
</style>
</head>
<body>

    <div id="app">
        <!-- ══════════════════════════════════════════════════════════════════
        SIDE PANEL
        (On phone/narrow screens this becomes a bottom drawer — see the
        #panel-tab pull handle and the max-width:780px media query above.)
        ══════════════════════════════════════════════════════════════════════ -->
        <aside id="panel">
            <div id="module-tabs"></div>

            <div id="panel-tab"><span class="grip"></span></div>

            <div id="panel-body">
                <div id="scroll">
                    <div>
                        <div class="section-title">Source</div>
                        <input type="file" id="file-in" accept="image/*" class="hidden-input">
                        <div id="drop-zone">
                            <span class="dz-icon">&#8595;</span>
                            DROP IMAGE<br>OR TAP TO BROWSE
                        </div>
                    </div>

                    <div id="module-desc"></div>
                    <div id="module-params"></div>

                    <div>
                        <div class="section-title">Export</div>
                        <div class="btn-row">
                            <button class="btn btn-accent" id="btn-png" disabled>&#8595; PNG</button>
                            <button class="btn" id="btn-reset" disabled>&#8634; Reset</button>
                        </div>
                    </div>
                </div>

                <div id="status-bar">
                    <div id="dot"></div>
                    <span id="status-msg">Drop an image to begin</span>
                </div>
            </div>
        </aside>

        <!-- ══════════════════════════════════════════════════════════════════
        VIEWPORT
        ══════════════════════════════════════════════════════════════════════ -->
        <main id="viewport">
            <div id="prog-wrap"><div id="prog-bar"></div></div>
            <div id="empty">
                <div class="empty-word">PYFORGE</div>
                <div class="empty-label">No image loaded</div>
            </div>
            <canvas id="main"></canvas>
        </main>
    </div>

    <script>
        (function() {
            // ═══════════════════════════════════════════════════════════════════
            // DOM REFS
            // ═══════════════════════════════════════════════════════════════════
            const mainCvs = document.getElementById('main');
            const ctx = mainCvs.getContext('2d', { willReadFrequently: true });
            const dropZone = document.getElementById('drop-zone');
            const empty = document.getElementById('empty');
            const dot = document.getElementById('dot');
            const statusMsg = document.getElementById('status-msg');
            const progWrap = document.getElementById('prog-wrap');
            const progBar = document.getElementById('prog-bar');
            const btnPng = document.getElementById('btn-png');
            const btnReset = document.getElementById('btn-reset');
            const tabsEl = document.getElementById('module-tabs');
            const descEl = document.getElementById('module-desc');
            const paramsEl = document.getElementById('module-params');
            const fileInput = document.getElementById('file-in');
            const viewport = document.getElementById('viewport');
            const panel = document.getElementById('panel');
            const panelTab = document.getElementById('panel-tab');

            // ═══════════════════════════════════════════════════════════════════
            // STATE
            // ═══════════════════════════════════════════════════════════════════
            let srcImg = null;
            let srcCanvas = null; // offscreen canvas at full source resolution
            let running = false;
            let activeModule = null;
            let currentVals = {};
            let debounceTimer = null;
            const MAX_DIM = 840; // process at ≤640px for performance
            let workingWidth = 0; // dimensions of current working canvas
            let workingHeight = 0;

            // ═══════════════════════════════════════════════════════════════════
            // HELPERS
            // ═══════════════════════════════════════════════════════════════════
            function setStatus(state, msg) {
                dot.className = state;
                statusMsg.textContent = msg;
            }

            function setProgress(pct) {
                const clamped = Math.min(100, Math.max(0, Math.round(pct)));
                progBar.style.width = clamped + '%';
                progWrap.classList.toggle('show', clamped > 0 && clamped < 100);
            }

            function yieldFrame() {
                return new Promise(r => requestAnimationFrame(r));
            }

            const Clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

            // ═══════════════════════════════════════════════════════════════════
// PRNG — fast 32-bit mulberry32
// ═══════════════════════════════════════════════════════════════════
function mulberry32(seed) {
    return function() {
        seed |= 0;
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// ═══════════════════════════════════════════════════════════════════
// CORE IMAGE UTILITIES
// ═══════════════════════════════════════════════════════════════════
const Core = {};

// Fast inline utility to prevent ReferenceErrors
const FastClamp = (val, min, max) => val < min ? min : (val > max ? max : val);

/** Convert RGBA Uint8ClampedArray to grayscale Float32Array [0–255] */
Core.toGray = function(data, w, h) {
    const out = new Float32Array(w * h);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        // Human eye weighting (BT.601 standard)
        out[p] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
    }
    return out;
};

/** 1D sliding-window box blur (In-place mutation to target buffer) */
Core.boxBlur1D = function(src, out, w, h, radius, horizontal) {
    const size = radius * 2 + 1;
    if (horizontal) {
        for (let y = 0; y < h; y++) {
            let acc = 0;
            const row = y * w;
            for (let x = -radius; x <= radius; x++) {
                acc += src[row + FastClamp(x, 0, w - 1)];
            }
            for (let x = 0; x < w; x++) {
                out[row + x] = acc / size;
                const addX = FastClamp(x + radius + 1, 0, w - 1);
                const subX = FastClamp(x - radius, 0, w - 1);
                acc += src[row + addX] - src[row + subX];
            }
        }
    } else {
        for (let x = 0; x < w; x++) {
            let acc = 0;
            for (let y = -radius; y <= radius; y++) {
                acc += src[FastClamp(y, 0, h - 1) * w + x];
            }
            for (let y = 0; y < h; y++) {
                out[y * w + x] = acc / size;
                const addY = FastClamp(y + radius + 1, 0, h - 1);
                const subY = FastClamp(y - radius, 0, h - 1);
                acc += src[addY * w + x] - src[subY * w + x];
            }
        }
    }
};

/** Optimized Gaussian approximation using double-buffer ping-ponging */
Core.gaussianApprox = function(src, w, h, radius) {
    if (radius <= 0) return src.slice();
    const r = Math.max(1, Math.round(radius));
    
    // Allocate only once! The ping-pong strategy.
    let bufferA = src.slice();
    let bufferB = new Float32Array(w * h);

    // Pass 1 & 2
    Core.boxBlur1D(bufferA, bufferB, w, h, r, true);
    Core.boxBlur1D(bufferB, bufferA, w, h, r, false);
    // Pass 3 & 4
    Core.boxBlur1D(bufferA, bufferB, w, h, r, true);
    Core.boxBlur1D(bufferB, bufferA, w, h, r, false);

    return bufferA; // Returned clean, zero allocations wasted
};

/** Sobel edge detection. Returns {gx, gy, mag, angle} */
Core.sobel = function(gray, w, h) {
    const gx = new Float32Array(w * h);
    const gy = new Float32Array(w * h);
    const mag = new Float32Array(w * h);
    const angle = new Float32Array(w * h);
    
    const radToDeg = 180 / Math.PI;

    for (let y = 1; y < h - 1; y++) {
        const row = y * w;
        const rowTop = (y - 1) * w;
        const rowBot = (y + 1) * w;

        for (let x = 1; x < w - 1; x++) {
            const i = row + x;
            
            const a = gray[rowTop + x - 1], b = gray[rowTop + x], c = gray[rowTop + x + 1];
            const d = gray[row + x - 1],                          f = gray[row + x + 1];
            const g = gray[rowBot + x - 1], hh = gray[rowBot + x], ii = gray[rowBot + x + 1];

            const dx = (c + 2 * f + ii) - (a + 2 * d + g);
            const dy = (g + 2 * hh + ii) - (a + 2 * b + c);

            gx[i] = dx;
            gy[i] = dy;
            mag[i] = Math.sqrt(dx * dx + dy * dy);
            angle[i] = Math.atan2(dy, dx) * radToDeg;
        }
    }
    return { gx, gy, mag, angle };
};

/** Iterative Median-Cut Palette Extraction (Fixes non-power-of-2 truncation) */
Core.extractPalette = function(data, w, h, k) {
    const pixels = [];
    const step = Math.max(1, Math.floor((w * h) / 4000));
    for (let i = 0; i < data.length; i += 4 * step) {
        pixels.push([data[i], data[i + 1], data[i + 2]]);
    }
    if (pixels.length === 0) return [[0, 0, 0]];

    // Array of boxes to manage splits iteratively
    let boxes = [pixels];

    // Helper to find range along an axis
    function getAxisRange(box, axis) {
        let min = 255, max = 0;
        for (let i = 0; i < box.length; i++) {
            const v = box[i][axis];
            if (v < min) min = v;
            if (v > max) max = v;
        }
        return max - min;
    }

    // Split until we reach exactly k clusters or can't split further
    while (boxes.length < k) {
        let splitIndex = -1;
        let maxRange = -1;
        let targetAxis = 0;

        // Find the box with the highest color variance/range
        for (let i = 0; i < boxes.length; i++) {
            if (boxes[i].length <= 1) continue;
            const rRange = getAxisRange(boxes[i], 0);
            const gRange = getAxisRange(boxes[i], 1);
            const bRange = getAxisRange(boxes[i], 2);
            
            const maxBoxRange = Math.max(rRange, gRange, bRange);
            if (maxBoxRange > maxRange) {
                maxRange = maxBoxRange;
                splitIndex = i;
                targetAxis = maxBoxRange === rRange ? 0 : (maxBoxRange === gRange ? 1 : 2);
            }
        }

        if (splitIndex === -1) break; // All boxes contain identical or single colors

        const boxToSplit = boxes[splitIndex];
        boxToSplit.sort((a, b) => a[targetAxis] - b[targetAxis]);
        const mid = boxToSplit.length >> 1;

        // Splice the new boxes back into the tracker
        boxes.splice(splitIndex, 1, boxToSplit.slice(0, mid), boxToSplit.slice(mid));
    }

    // Compute average colors for final palette
    return boxes.map(box => {
        let r = 0, g = 0, b = 0;
        for (const p of box) { r += p[0]; g += p[1]; b += p[2]; }
        const n = box.length || 1;
        return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
    });
};

/** Average RGB of a rectangular region */
Core.avgColor = function(data, imgW, x, y, w, h) {
    let r = 0, g = 0, b = 0, n = 0;
    const stepX = Math.max(1, Math.floor(w / 8));
    const stepY = Math.max(1, Math.floor(h / 8));
    for (let yy = y; yy < y + h; yy += stepY) {
        for (let xx = x; xx < x + w; xx += stepX) {
            const i = (yy * imgW + xx) * 4;
            r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
        }
    }
    n = n || 1;
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
};

/** Blocky mosaic pixelation */
Core.pixelateBlocks = function(data, w, h, p) {
    if (p <= 1) return;
    for (let y = 0; y < h; y += p) {
        for (let x = 0; x < w; x += p) {
            let r = 0, g = 0, b = 0, n = 0;
            const yEnd = Math.min(h, y + p), xEnd = Math.min(w, x + p);
            for (let yy = y; yy < yEnd; yy++) {
                for (let xx = x; xx < xEnd; xx++) {
                    const i = (yy * w + xx) * 4;
                    r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
                }
            }
            r /= n; g /= n; b /= n;
            for (let yy = y; yy < yEnd; yy++) {
                for (let xx = x; xx < xEnd; xx++) {
                    const i = (yy * w + xx) * 4;
                    data[i] = r; data[i + 1] = g; data[i + 2] = b;
                }
            }
        }
    }
};

/** Perceptually weighted nearest color match */
Core.nearestColor = function(r, g, b, palette) {
    let best = palette[0], bestD = Infinity;
    for (let i = 0; i < palette.length; i++) {
        const p = palette[i];
        // Human eyes are wildly sensitive to green variations. Weight accordingly!
        const dr = p[0] - r, dg = p[1] - g, db = p[2] - b;
        const d = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
        if (d < bestD) { bestD = d; best = p; }
    }
    return best;
};

/** Floyd-Steinberg error-diffusion dither */
Core.floydSteinberg = function(data, w, h, palette) {
    const buf = new Float32Array(w * h * 3);
    for (let i = 0, p = 0; i < data.length; i += 4, p += 3) {
        buf[p] = data[i]; buf[p + 1] = data[i + 1]; buf[p + 2] = data[i + 2];
    }
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const p = (y * w + x) * 3;
            const r = buf[p], g = buf[p + 1], b = buf[p + 2];
            const nc = Core.nearestColor(r, g, b, palette);
            
            buf[p] = nc[0]; buf[p + 1] = nc[1]; buf[p + 2] = nc[2];
            
            const er = r - nc[0], eg = g - nc[1], eb = b - nc[2];
            const pushErr = (xx, yy, f) => {
                if (xx < 0 || xx >= w || yy < 0 || yy >= h) return;
                const q = (yy * w + xx) * 3;
                buf[q] += er * f; buf[q + 1] += eg * f; buf[q + 2] += eb * f;
            };
            pushErr(x + 1, y,     7 / 16);
            pushErr(x - 1, y + 1, 3 / 16);
            pushErr(x,     y + 1, 5 / 16);
            pushErr(x + 1, y + 1, 1 / 16);
        }
    }
    for (let i = 0, p = 0; i < data.length; i += 4, p += 3) {
        data[i]     = FastClamp(Math.round(buf[p]), 0, 255);
        data[i + 1] = FastClamp(Math.round(buf[p + 1]), 0, 255);
        data[i + 2] = FastClamp(Math.round(buf[p + 2]), 0, 255);
        // Alpha is untouched, keeping structural integrity intact
    }
};

/** Bayer 8×8 matrix normalized to [-0.5, 0.5) */
const BAYER_8x8 = [
    [0, 32, 8, 40, 2, 34, 10, 42],
    [48, 16, 56, 24, 50, 18, 58, 26],
    [12, 44, 4, 36, 14, 46, 6, 38],
    [60, 28, 52, 20, 62, 30, 54, 22],
    [3, 35, 11, 43, 1, 33, 9, 41],
    [51, 19, 59, 27, 49, 17, 57, 25],
    [15, 47, 7, 39, 13, 45, 5, 37],
    [63, 31, 55, 23, 61, 29, 53, 21]
].map(row => row.map(v => v / 64 - 0.5));

/** Bayer ordered dither */
Core.bayerDither = function(data, w, h, palette, spread) {
    for (let y = 0; y < h; y++) {
        const row = y * w;
        for (let x = 0; x < w; x++) {
            const i = (row + x) * 4;
            const thresh = BAYER_8x8[y & 7][x & 7] * spread;
            const r = FastClamp(data[i] + thresh, 0, 255);
            const g = FastClamp(data[i + 1] + thresh, 0, 255);
            const b = FastClamp(data[i + 2] + thresh, 0, 255);
            const nc = Core.nearestColor(r, g, b, palette);
            data[i] = nc[0]; data[i + 1] = nc[2]; data[i + 2] = nc[2];
        }
    }
};

/** Recursive quadtree split based on standard deviation of luminance */
Core.quadSplit = function(data, imgW, x, y, w, h, depth, opts) {
    const { minSize, maxDepth, entropyLimit, minDepth, onLeaf } = opts;
    if (w <= minSize || h <= minSize || depth >= maxDepth) {
        onLeaf(x, y, w, h);
        return;
    }
    let sum = 0, sumSq = 0, n = 0;
    const stepX = Math.max(1, Math.floor(w / 16));
    const stepY = Math.max(1, Math.floor(h / 16));
    for (let yy = y; yy < y + h; yy += stepY) {
        for (let xx = x; xx < x + w; xx += stepX) {
            const i = (yy * imgW + xx) * 4;
            const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
            sum += lum; sumSq += lum * lum; n++;
        }
    }
    const mean = sum / (n || 1);
    const variance = Math.max(0, sumSq / (n || 1) - mean * mean);
    const stddev = Math.sqrt(variance);

    if (stddev > entropyLimit || depth < minDepth) {
        const hw = w >> 1, hh = h >> 1;
        if (hw < 1 || hh < 1) { onLeaf(x, y, w, h); return; }
        Core.quadSplit(data, imgW, x, y, hw, hh, depth + 1, opts);
        Core.quadSplit(data, imgW, x + hw, y, w - hw, hh, depth + 1, opts);
        Core.quadSplit(data, imgW, x, y + hh, hw, h - hh, depth + 1, opts);
        Core.quadSplit(data, imgW, x + hw, y + hh, w - hw, h - hh, depth + 1, opts);
    } else {
        onLeaf(x, y, w, h);
    }
};

            /** Sobel-derived directional ink strokes with drift-drag trailing and pooling. */
            async function runInkStrokes(ctx, w, h, v) {
                const id = ctx.getImageData(0, 0, w, h);
                const data = id.data;
                let gray = Core.toGray(data, w, h);
                setStatus('on', 'Pre-blurring…');
                gray = Core.gaussianApprox(gray, w, h, v.preblur);
                await yieldFrame();
                setProgress(20);

                setStatus('on', 'Computing gradient magnitude…');
                const { mag } = Core.sobel(gray, w, h);
                let maxMag = 0;
                for (let i = 0; i < mag.length; i++)
                    if (mag[i] > maxMag) maxMag = mag[i];
                const norm = new Float32Array(mag.length);
                for (let i = 0; i < mag.length; i++) norm[i] = maxMag > 0 ? mag[i] / maxMag * 255 : 0;
                await yieldFrame();
                setProgress(40);

                let stroke = new Float32Array(w * h);
                for (let i = 0; i < stroke.length; i++) {
                    const inkWeight = Clamp((norm[i] - v.threshold) / (255 - v.threshold), 0, 1);
                    stroke[i] = 255 - inkWeight * 255;
                }
                stroke = Core.gaussianApprox(stroke, w, h, 0.5);
                setProgress(55);

                for (let c = 0; c < v.cycles; c++) {
                    const dragged = new Float32Array(w * h);
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const sx = Clamp(x - v.driftX, 0, w - 1);
                            const sy = Clamp(y - v.driftY, 0, h - 1);
                            dragged[y * w + x] = stroke[sy * w + sx];
                        }
                    }
                    for (let i = 0; i < stroke.length; i++) stroke[i] = Math.min(stroke[i], dragged[i]);
                    await yieldFrame();
                    setProgress(55 + Math.round((c + 1) / Math.max(1, v.cycles) * 20));
                }

                const poolMask = Core.gaussianApprox(stroke.map(s => 255 - s), w, h, 2.0);
                for (let i = 0; i < stroke.length; i++) {
                    const pm = Clamp(poolMask[i] * v.pool, 0, 60);
                    stroke[i] = Clamp(stroke[i] - pm, 0, 255);
                }
                setProgress(85);

                for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                    const val = stroke[p];
                    data[i] = val;
                    data[i + 1] = val;
                    data[i + 2] = val;
                    data[i + 3] = 255;
                }
                ctx.putImageData(id, 0, 0);
                setProgress(100);

            /** Three-layer ink wash composited onto paper, with optional hanko seal. */
            async function runSumieWash(ctx, w, h, v) {
                const id = ctx.getImageData(0, 0, w, h);
                const data = id.data;
                const gray = Core.toGray(data, w, h);

                setStatus('on', 'Ghost wash…');

                    i] : 255;
                const ghost = Core.gaussianApprox(ghostMask, w, h, v.ghostBlur);

                const bloomMask = new Float32Array(w * h);

                let bloom = Core.gaussianApprox(bloomMask, w, h, v.bloomBlur);

                    dy = 1;

                for (let y = 0; y < h; y++)
                    for (let x = 0; x < w; x++) {

                            sy = Clamp(y - dy, 0, h - 1);
                        drifted[y * w + x] = bloom[sy * w + sx];
                    }
                for (let i = 0; i < bloom.length; i++) bloom[i] = Math.min(bloom[i], drifted[i]);
                await yieldFrame();

                setStatus('on', 'Black strokes…');
                const smoothed = Core.gaussianApprox(gray, w, h, 1);
                const { mag } = Core.sobel(smoothed, w, h);
                let maxMag = 0;
                for (let i = 0; i < mag.length; i++)
                    if (mag[i] > maxMag) maxMag = mag[i];
                let strokes = new Float32Array(w * h);
                for (let i = 0; i < mag.length; i++) {
                    const m = maxMag > 0 ? mag[i] / maxMag * 255 : 0;
                    const inkWeight = Clamp((m - v.strokeThresh) / (255 - v.strokeThresh), 0, 1);
                    strokes[i] = 255 - inkWeight * 255;

                                    }

                            await yieldFrame(); }
                    }

                    for (let i = 0; i < data.length; i++) data[i] = out[i];
                    ctx.putImageData(id, 0, 0);
                    setProgress(100);
                }
            });

            // ── 4. DITHER ──────────────────────────────────────────────────────
            // Merged "Ordered Dither" (Bayer 8x8) + "Floyd-Steinberg" into one
            // module with an algorithm switch. Both share the same pixelate
            // and palette-extraction math, now pulled into Core helpers instead
            // of being duplicated per-module.
            MODULES.push({
                id: 'dither',
                name: 'Dither',
                desc: 'Ordered: Bayer 8×8 ordered dithering, crisp cross-hatch grid pattern. Floyd-Steinberg: error-diffusion dithering, smoother and more organic grain. Both map to an auto-extracted (or grayscale) palette.',
                params: [
                    { key: 'algorithm', label: 'Algorithm', type: 'select', options: [
                            'ordered', 'floyd-steinberg'
                        ], default: 'ordered' },
                    { key: 'colors', label: 'Palette Size', type: 'range', min: 2, max: 32, step: 1,
                        default: 8 },
                    { key: 'grayscale', label: 'Luminance Mode', type: 'checkbox', default: false },
                    { key: 'spread', label: 'Dither Spread (Ordered)', type: 'range', min: 0, max: 120,
                        step: 5, default: 50 },
                    { key: 'pixelate', label: 'Pixelate', type: 'range', min: 1, max: 12, step: 1,
                        default: 1 },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;

                    setStatus('on', 'Pixelating…');
                    Core.pixelateBlocks(data, w, h, Math.round(v.pixelate));
                    await yieldFrame();
                    setProgress(25);

                    setStatus('on', 'Extracting palette…');
                    let palette;
                    if (v.grayscale) {
                        const n = Math.round(v.colors);
                        palette = Array.from({ length: n }, (_, i) => {
                            const g = Math.round(i * 255 / (n - 1 || 1));
                            return [g, g, g];
                        });
                    } else {
                        palette = Core.extractPalette(data, w, h, Math.round(v.colors));
                    }
                    await yieldFrame();
                    setProgress(50);

                    if (v.algorithm === 'floyd-steinberg') {
                        setStatus('on', 'Diffusing error…');
                        await yieldFrame();
                        Core.floydSteinberg(data, w, h, palette);
                    } else {
                        setStatus('on', 'Applying ordered dither…');
                        await yieldFrame();
                        Core.bayerDither(data, w, h, palette, v.spread);
                    }
                    ctx.putImageData(id, 0, 0);
                    setProgress(100);
                }
            });

            // ── 5. CRT SIMULATOR ──────────────────────────────────────────────
            MODULES.push({
                id: 'crt',
                name: 'CRT Simulator',
                desc: 'Pixelate + quantize + scanlines + glowing bezel frame. Simulates an old television or arcade monitor.',
                params: [
                    { key: 'pixelSize', label: 'Pixel Size', type: 'range', min: 2, max: 14, step: 1,
                        default: 6 },
                    { key: 'colors', label: 'Color Count', type: 'range', min: 2, max: 32, step: 1,
                        default: 6 },
                    { key: 'scanGap', label: 'Scanline Gap', type: 'range', min: 1, max: 8, step: 1,
                        default: 3 },
                    { key: 'frameSize', label: 'Bezel Size', type: 'range', min: 0, max: 60, step: 2,
                        default: 20 },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;
                    const p = Math.round(v.pixelSize);

                    setStatus('on', 'Pixel-crushing…');
                    let avgR = 0,
                        avgG = 0,
                        avgB = 0;
                    for (let i = 0; i < data.length; i += 4) { avgR += data[i];
                        avgG += data[i + 1];
                        avgB += data[i + 2]; }
                    const pc = data.length / 4;
                    avgR /= pc;
                    avgG /= pc;
                    avgB /= pc;

                    for (let y = 0; y < h; y += p)
                        for (let x = 0; x < w; x += p) {
                            let r = 0,
                                g = 0,
                                b = 0,
                                n = 0;
                            for (let yy = y; yy < Math.min(h, y + p); yy++)
                                for (let xx = x; xx < Math.min(w, x + p); xx++) {
                                    const i = (yy * w + xx) * 4;
                                    r += data[i];
                                    g += data[i + 1];
                                    b += data[i + 2];
                                    n++;
                                }
                            r /= n;
                            g /= n;
                            b /= n;
                            for (let yy = y; yy < Math.min(h, y + p); yy++)
                                for (let xx = x; xx < Math.min(w, x + p); xx++) {
                                    const i = (yy * w + xx) * 4;
                                    data[i] = r;
                                    data[i + 1] = g;
                                    data[i + 2] = b;
                                }
                        }
                    await yieldFrame();
                    setProgress(35);

                    setStatus('on', 'Quantizing palette…');
                    const palette = Core.extractPalette(data, w, h, Math.round(v.colors));
                    for (let i = 0; i < data.length; i += 4) {
                        const nc = Core.nearestColor(data[i], data[i + 1], data[i + 2], palette);
                        data[i] = nc[0];
                        data[i + 1] = nc[1];
                        data[i + 2] = nc[2];
                    }
                    await yieldFrame();
                    setProgress(65);

                    setStatus('on', 'Scanlines + bezel…');
                    const gap = Math.round(v.scanGap);
                    for (let y = 0; y < h; y += gap)
                        for (let x = 0; x < w; x++) { const i = (y * w + x) * 4;
                            data[i] = 0;
                            data[i + 1] = 0;
                            data[i + 2] = 0; }

                    const frame = Math.round(v.frameSize);
                    if (frame > 0) {
                        const cw = w + frame * 2,
                            ch = h + frame * 2;
                        const glow = [Math.min(255, avgR * 1.3), Math.min(255, avgG * 1.3), Math.min(255,
                            avgB * 1.3)];
                        const outCanvas = document.createElement('canvas');
                        outCanvas.width = cw;
                        outCanvas.height = ch;
                        const octx = outCanvas.getContext('2d');
                        octx.fillStyle = `rgb(${glow[0]},${glow[1]},${glow[2]})`;
                        octx.fillRect(0, 0, cw, ch);
                        octx.fillStyle = '#000';
                        const pad = Math.round(frame * 0.5);
                        octx.fillRect(frame - pad, frame - pad, cw - 2 * (frame - pad), ch - 2 * (frame -
                            pad));
                        const tmp = document.createElement('canvas');
                        tmp.width = w;
                        tmp.height = h;
                        tmp.getContext('2d').putImageData(id, 0, 0);
                        octx.drawImage(tmp, frame, frame);
                        // Resize main canvas to include bezel; working dims updated
                        mainCvs.width = cw;
                        mainCvs.height = ch;
                        workingWidth = cw;
                        workingHeight = ch;
                        ctx.drawImage(outCanvas, 0, 0);
                        setProgress(100);
                        return;
                    }
                    ctx.putImageData(id, 0, 0);
                    setProgress(100);
                }
            });

            // ── 6. GLITCH SHRED ────────────────────────────────────────────────
            // Replaces the old "Glitch Collapse" module (rectangle tearing +
            // fake error text) with the chunk-tear / chromatic-bleed / edge-
            // enhance pipeline ported from the GOBLIN_SURGE shredder script.
            MODULES.push({
                id: 'glitch',
                name: 'Glitch Shred',
                desc: 'Spatial tearing (rectangular chunks copy/pasted, optionally flipped) plus RGB chromatic bleed and edge enhancement. Ported from the GOBLIN_SURGE shredder engine.',
                params: [
                    { key: 'intensity', label: 'Destruction Intensity', type: 'range', min: 1, max: 10,
                        step: 1, default: 5 },
                    { key: 'allowFlips', label: 'Allow Flipped Tears', type: 'checkbox', default: true },
                    { key: 'sharpen', label: 'Edge Enhance', type: 'checkbox', default: true },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;
                    const rng = mulberry32((Date.now() & 0xffffffff) >>> 0);
                    const intensity = v.intensity;

                    setStatus('on', 'Tearing spatial fabric…');
                    const tears = Math.round(50 * (intensity / 5) * 2.24);
                    for (let t = 0; t < tears; t++) {
                        const sw = 10 + Math.floor(rng() * Math.max(1, w * 0.4 - 10));
                        const sh = 5 + Math.floor(rng() * 75);
                        const x1 = Math.floor(rng() * Math.max(1, w - sw));
                        const y1 = Math.floor(rng() * Math.max(1, h - sh));
                        const x2 = Math.floor(rng() * Math.max(1, w - sw));
                        const y2 = Math.floor(rng() * Math.max(1, h - sh));
                        const flip = v.allowFlips && rng() > 0.3;
                        const flipHorizontal = rng() < 0.5;

                        // Copy the (x1,y1,sw,sh) chunk onto (x2,y2), reading into a
                        // scratch buffer first so overlapping src/dst never smears.
                        const chunk = new Uint8ClampedArray(sw * sh * 3);
                        for (let yy = 0; yy < sh; yy++) {
                            for (let xx = 0; xx < sw; xx++) {
                                const si = ((y1 + yy) * w + (x1 + xx)) * 4;
                                const ci = (yy * sw + xx) * 3;
                                chunk[ci] = data[si];
                                chunk[ci + 1] = data[si + 1];
                                chunk[ci + 2] = data[si + 2];
                            }
                        }
                        for (let yy = 0; yy < sh; yy++) {
                            for (let xx = 0; xx < sw; xx++) {
                                let sx = xx, sy = yy;
                                if (flip) { if (flipHorizontal) sx = sw - 1 - xx;
                                    else sy = sh - 1 - yy; }
                                const ci = (sy * sw + sx) * 3;
                                const di = ((y2 + yy) * w + (x2 + xx)) * 4;
                                data[di] = chunk[ci];
                                data[di + 1] = chunk[ci + 1];
                                data[di + 2] = chunk[ci + 2];
                            }
                        }
                        if (t % 20 === 0) { setProgress(Math.round(t / tears * 50));
                            await yieldFrame(); }
                    }
                    setProgress(50);

                    setStatus('on', 'Chromatic bleed…');
                    const shift = Math.round(30 * (intensity / 5));
                    const src = new Uint8ClampedArray(data);
                    const rShiftX = Math.floor(rng() * (2 * shift + 1)) - shift;
                    const rShiftY = Math.floor(rng() * 11) - 5;
                    const bShiftX = Math.floor(rng() * 11) - 5;
                    const bShiftY = Math.floor(rng() * (2 * shift + 1)) - shift;
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const di = (y * w + x) * 4;
                            const rx = Clamp(x - rShiftX, 0, w - 1),
                                ry = Clamp(y - rShiftY, 0, h - 1);
                            const bxp = Clamp(x - bShiftX, 0, w - 1),
                                byp = Clamp(y - bShiftY, 0, h - 1);
                            data[di] = src[(ry * w + rx) * 4];
                            data[di + 2] = src[(byp * w + bxp) * 4 + 2];
                        }
                    }
                    await yieldFrame();
                    setProgress(80);

                    if (v.sharpen) {
                        setStatus('on', 'Edge enhance…');
                        for (let ch = 0; ch < 3; ch++) {
                            const chan = new Float32Array(w * h);
                            for (let i = 0, p = 0; i < data.length; i += 4, p++) chan[p] = data[i + ch];
                            const blurred = Core.gaussianApprox(chan, w, h, 1);
                            for (let i = 0, p = 0; i < data.length; i += 4, p++) {
                                data[i + ch] = Clamp(chan[p] + (chan[p] - blurred[p]) * 0.6, 0, 255);
                            }
                            await yieldFrame();
                        }
                    }
                    ctx.putImageData(id, 0, 0);
                    setProgress(100);
                }
            });

            // ── 7. CASCADE SORT ───────────────────────────────────────────────
            MODULES.push({
                id: 'cascade',
                name: 'Cascade Sort',
                desc: 'Column-wise pixel sorting between edge-detected ledges, with overhang shadow and highlight faking.',
                params: [
                    { key: 'edgeThresh', label: 'Edge Threshold', type: 'range', min: 5, max: 100,
                        step: 1, default: 32 },
                    { key: 'streakMax', label: 'Max Streak', type: 'range', min: 20, max: 500, step: 10,
                        default: 200 },
                    { key: 'shadowLen', label: 'Shadow Length', type: 'range', min: 0, max: 60, step: 2,
                        default: 20 },
                    { key: 'reverse', label: 'Reverse Gravity', type: 'checkbox', default: false },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;
                    const gray = Core.toGray(data, w, h);
                    const { mag } = Core.sobel(gray, w, h);
                    const src = new Uint8ClampedArray(data);
                    setStatus('on', 'Sorting cascades…');

                    for (let x = 0; x < w; x++) {
                        let y = 0;
                        while (y < h) {
                            let yEnd = y + 1;
                            while (yEnd < h && mag[yEnd * w + x] < v.edgeThresh && (yEnd - y) < v
                                .streakMax) yEnd++;
                            const segment = [];
                            for (let sy = y; sy < yEnd; sy++) {
                                const i = (sy * w + x) * 4;
                                segment.push([src[i], src[i + 1], src[i + 2]]);
                            }
                            segment.sort((a, b) => {
                                const la = 0.299 * a[0] + 0.587 * a[1] + 0.114 * a[2];
                                const lb = 0.299 * b[0] + 0.587 * b[1] + 0.114 * b[2];
                                return v.reverse ? la - lb : lb - la;
                            });
                            for (let idx = 0, sy = y; sy < yEnd; sy++, idx++) {
                                let [r, g, b] = segment[idx];
                                if (y > 0 && idx < v.shadowLen) {
                                    const shadeFactor = idx / v.shadowLen;
                                    const shade = 0.2 + 0.8 * Math.pow(shadeFactor, 0.5);
                                    r *= shade;
                                    g *= shade;
                                    b *= shade;
                                }
                                if (sy === yEnd - 1 && yEnd < h) {
                                    r = Math.min(255, r + 40);
                                    g = Math.min(255, g + 40);
                                    b = Math.min(255, b + 40);
                                }
                                const di = (sy * w + x) * 4;
                                data[di] = Clamp(Math.round(r), 0, 255);
                                data[di + 1] = Clamp(Math.round(g), 0, 255);
                                data[di + 2] = Clamp(Math.round(b), 0, 255);
                                data[di + 3] = 255;
                            }
                            y = yEnd;
                        }
                        if (x % 30 === 0) { setProgress(Math.round(x / w * 100));
                            await yieldFrame(); }
                    }
                    ctx.putImageData(id, 0, 0);
                    setProgress(100);
                }
            });

            // ── 8. CONSTELLATION WEAVE ───────────────────────────────────────
            MODULES.push({
                id: 'constellation',
                name: 'Constellation Weave',
                desc: 'Extracts edge-strength node coordinates, then weaves faint threads between nearby nodes — a Delaunay-ish vector reconstruction.',
                params: [
                    { key: 'sampleRate', label: 'Sample Rate', type: 'range', min: 4, max: 24, step: 1,
                        default: 10 },
                    { key: 'edgeThresh', label: 'Node Threshold', type: 'range', min: 10, max: 100,
                        step: 5, default: 40 },
                    { key: 'maxDist', label: 'Max Connection', type: 'range', min: 20, max: 200, step: 5,
                        default: 80 },
                    { key: 'lineAlpha', label: 'Line Strength', type: 'range', min: 5, max: 100, step: 5,
                        default: 40 },
                    { key: 'onWhite', label: 'White Background', type: 'checkbox', default: true },
                ],
                async run(ctx, w, h, v) {
                    const id = ctx.getImageData(0, 0, w, h);
                    const data = id.data;
                    const gray = Core.toGray(data, w, h);
                    const { mag } = Core.sobel(gray, w, h);

                    setStatus('on', 'Extracting nodes…');
                    const nodes = [];
                    const step = Math.round(v.sampleRate);
                    for (let y = 0; y < h; y += step) {
                        for (let x = 0; x < w; x += step) {
                            if (mag[y * w + x] > v.edgeThresh) nodes.push([x, y]);
                        }
                    }
                    await yieldFrame();
                    setProgress(25);

                    const bg = v.onWhite ? 255 : 0;
                    for (let i = 0; i < data.length; i += 4) { data[i] = bg;
                        data[i + 1] = bg;
                        data[i + 2] = bg;
                        data[i + 3] = 255; }
                    ctx.putImageData(id, 0, 0);

                    setStatus('on', `Weaving ${nodes.length} nodes…`);
                    const lineColor = v.onWhite ? '40,40,50' : '200,200,220';
                    const maxD = v.maxDist;
                    const n = nodes.length;
                    const capped = n > 1200;
                    for (let i = 0; i < n; i++) {
                        const [x1, y1] = nodes[i];
                        const jEndLimit = capped ? Math.min(n, i + 400) : n;
                        for (let j = i + 1; j < jEndLimit; j++) {
                            const [x2, y2] = nodes[j];
                            const dist = Math.hypot(x2 - x1, y2 - y1);
                            if (dist < maxD) {
                                const alpha = (1 - dist / maxD) * (v.lineAlpha / 255);
                                ctx.strokeStyle = `rgba(${lineColor},${alpha.toFixed(3)})`;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(x1, y1);
                                ctx.lineTo(x2, y2);
                                ctx.stroke();
                            }
                        }
                        if (i % 60 === 0) { setProgress(25 + Math.round(i / n * 65));
                            await yieldFrame(); }
                    }
                    ctx.fillStyle = `rgba(${lineColor},0.4)`;
                    for (const [x, y] of nodes) ctx.fillRect(x - 1, y - 1, 2, 2);
                    setProgress(100);
                }
            });

            // ═══════════════════════════════════════════════════════════════════
            // CONTROLLER
            // ═══════════════════════════════════════════════════════════════════

            /** Build module tab buttons */
            function buildTabs() {
                tabsEl.innerHTML = '';
                MODULES.forEach((m, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'mtab';
                    btn.innerHTML =
                        `<span class="mnum">${String(i + 1).padStart(2, '0')}</span>${m.name}`;
                    btn.addEventListener('click', () => selectModule(m.id));
                    btn.dataset.id = m.id;
                    tabsEl.appendChild(btn);
                });
            }

            /** Select a module by ID, rebuild param UI, schedule render */
            function selectModule(id) {
                activeModule = MODULES.find(m => m.id === id);
                [...tabsEl.children].forEach(el => el.classList.toggle('active', el.dataset.id ===
                id));
                descEl.innerHTML = `<div class="effect-desc">${activeModule.desc}</div>`;
                currentVals = {};
                activeModule.params.forEach(p => currentVals[p.key] = p.default);
                buildParamUI();
                if (srcCanvas) scheduleRender();
            }

            /** Build parameter controls for the active module */
            function buildParamUI() {
                paramsEl.innerHTML = '';
                const wrap = document.createElement('div');
                wrap.className = 'params';
                activeModule.params.forEach(p => {
                    const row = document.createElement('div');
                    row.className = 'param';
                    if (p.type === 'range') {
                        const stepInt = Number.isInteger(p.step);
                        const displayVal = stepInt ? p.default : p.default.toFixed(2);
                        row.innerHTML = `
                  <div class="param-row">
                    <span class="param-name">${p.label}</span>
                    <span class="param-val" data-val="${p.key}">${displayVal}</span>
                  </div>
                  <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.default}" data-key="${p.key}">
                `;
                        const input = row.querySelector('input');
                        const valEl = row.querySelector('.param-val');
                        input.addEventListener('input', () => {
                            const num = parseFloat(input.value);
                            currentVals[p.key] = num;
                            valEl.textContent = stepInt ? Math.round(num) : num.toFixed(2);
                            scheduleRender();
                        });
                    } else if (p.type === 'select') {
                        const opts = p.options.map(o =>
                            `<option value="${o}" ${o === p.default ? 'selected' : ''}>${o}</option>`
                        ).join('');
                        row.innerHTML = `
                  <div class="param-name">${p.label}</div>
                  <div class="select-wrap">
                    <select data-key="${p.key}">${opts}</select>
                    <span class="select-arrow">▾</span>
                  </div>
                `;
                        row.querySelector('select').addEventListener('change', (e) => {
                            currentVals[p.key] = e.target.value;
                            scheduleRender();
                        });
                    } else if (p.type === 'checkbox') {
                        row.innerHTML = `
                  <label class="checkrow">
                    <input type="checkbox" ${p.default ? 'checked' : ''} data-key="${p.key}">
                    <span>${p.label}</span>
                  </label>
                `;
                        row.querySelector('input').addEventListener('change', (e) => {
                            currentVals[p.key] = e.target.checked;
                            scheduleRender();
                        });
                    }
                    wrap.appendChild(row);
                });
                paramsEl.appendChild(wrap);
            }

            /** Debounced render trigger */
            function scheduleRender() {
                if (!srcCanvas || !activeModule) return;
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(runActiveModule, 120);
            }

            /** Downscale source to maxDim for processing */
            function downscaleForProcessing(source, maxDim) {
                const w = source.width,
                    h = source.height;
                const longest = Math.max(w, h);
                const scale = longest > maxDim ? maxDim / longest : 1;
                const cw = Math.max(1, Math.round(w * scale));
                const ch = Math.max(1, Math.round(h * scale));
                const c = document.createElement('canvas');
                c.width = cw;
                c.height = ch;
                c.getContext('2d').drawImage(source, 0, 0, cw, ch);
                return { canvas: c, scale, width: cw, height: ch };
            }

            /** Run the active module on the current source */
            async function runActiveModule() {
                if (running || !srcCanvas || !activeModule) return;
                running = true;
                btnPng.disabled = true;
                btnReset.disabled = true;

                // Reset working canvas to a fresh downscaled copy each run
                const work = downscaleForProcessing(srcCanvas, MAX_DIM);
                mainCvs.width = work.width;
                mainCvs.height = work.height;
                workingWidth = work.width;
                workingHeight = work.height;
                ctx.drawImage(work.canvas, 0, 0);

                try {
                    await activeModule.run(ctx, workingWidth, workingHeight, currentVals);
                    // Update working dims in case module changed canvas size (e.g. CRT bezel)
                    workingWidth = mainCvs.width;
                    workingHeight = mainCvs.height;
                    setStatus('ok', `${activeModule.name} — ready`);
                } catch (err) {
                    setStatus('', 'Error — see console');
                    console.error('Module error:', err);
                }
                setProgress(0);
                running = false;
                btnPng.disabled = false;
                btnReset.disabled = false;
            }

            // ── FILE LOADING ──────────────────────────────────────────────────
            function loadImageFile(file) {
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        srcImg = img;
                        srcCanvas = document.createElement('canvas');
                        srcCanvas.width = img.naturalWidth;
                        srcCanvas.height = img.naturalHeight;
                        srcCanvas.getContext('2d').drawImage(img, 0, 0);

                        empty.style.display = 'none';
                        mainCvs.classList.add('show');
                        btnReset.disabled = false;
                        setStatus('ok', `Loaded ${img.naturalWidth}×${img.naturalHeight}`);
                        panel.classList.remove('expanded'); // let the image take over on phone

                        if (!activeModule) selectModule(MODULES[0].id);
                        else scheduleRender();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            // Drop zone events
            panelTab.addEventListener('click', () => panel.classList.toggle('expanded'));
            empty.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files[0]) loadImageFile(e.target.files[0]);
            });
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('over');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('over');
                if (e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
            });

            // Also allow dropping anywhere on the viewport
            viewport.addEventListener('dragover', (e) => e.preventDefault());
            viewport.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
            });

            // ── EXPORT ────────────────────────────────────────────────────────
            btnPng.addEventListener('click', () => {
                if (!srcCanvas) return;
                // Export at current working resolution (preserves bezel etc.)
                const outCanvas = document.createElement('canvas');
                outCanvas.width = workingWidth;
                outCanvas.height = workingHeight;
                const octx = outCanvas.getContext('2d');
                octx.imageSmoothingEnabled = false;
                octx.drawImage(mainCvs, 0, 0);

                outCanvas.toBlob((blob) => {
                    if (!blob) return;
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `PYFORGE_${activeModule ? activeModule.id : 'export'}_${Date.now()}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                }, 'image/png');
            });

            // ── RESET ─────────────────────────────────────────────────────────
            btnReset.addEventListener('click', () => {
                if (!srcCanvas || !activeModule) return;
                currentVals = {};
                activeModule.params.forEach(p => currentVals[p.key] = p.default);
                buildParamUI();
                scheduleRender();
            });

            // ── INIT ──────────────────────────────────────────────────────────
            buildTabs();
            selectModule(MODULES[0].id);
            setStatus('', 'Drop an image to begin');
            workingWidth = mainCvs.width;
            workingHeight = mainCvs.height;

        })();
    </script>
</body>
</html>
